<!-- @dsCard group="Forms" viewport="420x260" name="CodeField" subtitle="one-time code — 2FA, one box per digit" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
<style>.dim{font-family:var(--th-ui);font-size:var(--text-control-sm);color:var(--gray-600);line-height:1.5;margin-top:14px}</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { mountCodeField, h, mount, raw } = LDS;

// The only card here that mounts a controller directly, because a code field is
// nothing without one: paste filling the whole code, backspace stepping back and
// focus walking forward are the component.
function Demo(){
  return h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
    h('div',{className:'field'}),
    h('p',{className:'dim'},'Numeric keypad, tabular figures, autocomplete="one-time-code" on the first box. Paste fills the set; backspace steps back. Pass length for 4- or 8-digit codes and size="sm" for 36px boxes.'));
}
const root = document.getElementById('root');
mount(root, h(Demo));
mountCodeField(root.querySelector('.field'), {
  label: 'Verification code', length: 6, groupAfter: 3, value: '482',
  help: 'Six digits, from your authenticator app.',
});
</script>
</body></html>
