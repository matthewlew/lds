<!-- @dsCard group="Foundations" viewport="880x620" name="Icon" subtitle="Open Icons — 174 symbols, 24px grid, stroke 2" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
<style>
.lbl{font-family:var(--th-ui);font-size:12px;font-weight:500;color:var(--gray-700);margin-bottom:10px}
.dim{font-family:var(--th-ui);font-size:12px;color:var(--gray-600);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:14px 8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cell span{font-family:var(--th-ui);font-size:10px;color:var(--gray-600);line-height:1.2;word-break:break-word}
.sizes{display:flex;align-items:flex-end;gap:22px}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--th-ui);font-size:10px;color:var(--gray-600)}
</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { icon, h, mount, raw } = LDS;
const H = '../assets/icons.svg';
// A cross-section of the set, in the order a UI reaches for them.
const SHOWN = [
  'search','close','check','add','minus','menu','filter','sort',
  'chevron-left','chevron-right','chevron-up','chevron-down','arrow-left','arrow-right','arrow-up','arrow-down',
  'info','warning','check-circle','close-circle','help','bell','clock','history',
  'person','people','mail','chat','home','settings','lock','log-out',
  'file','folder','copy','edit','trash','download','upload','external',
  'photo','star','heart','bookmark','flag','pin','location','link',
  'eye','eye-off','more-horizontal','more-vertical','grid','list','refresh','swap',
];
function Demo(){
  return h('div',{style:{display:'flex',flexDirection:'column',gap:26}},
    h('div',null,
      h('div',{className:'lbl'},'Sizes'),
      h('div',{className:'sizes'},        [['--icon-size-sm',16],['--icon-size (default)',20],['--icon-size-lg',24],['',32],['',40]].map(([tok,px])=>
          h('div',{key:px},
            h(icon,{name:'bell',href:H,size:px,style:{color:'var(--gray-800)'}}),
            h('span',null,tok ? `${px}px · ${tok}` : `${px}px`)))),
      h('div',{className:'dim',style:{marginTop:10}},'Drawn on a 24px grid with a 20×20 live area and a stroke of 2 — the stroke is part of the drawing, not a CSS knob, so scale the icon rather than restyling its weight.')),
    h('div',null,
      h('div',{className:'lbl'},'The set — 54 of 174 shown'),
      h('div',{className:'grid'},
        SHOWN.map(n=>h('div',{key:n,className:'cell'},
          h(icon,{name:n,href:H,size:24,style:{color:'var(--gray-800)'}}),
          h('span',null,n)))),
      h('div',{className:'dim',style:{marginTop:14}},'From matthewlew/open-icons (MIT). Names are kebab-case and match the upstream set exactly; many have a -fill counterpart (bell-fill, check-circle-fill). ../assets/icons.svg is generated from icons/icons.json — regenerate it rather than hand-editing.')));
}
mount(document.getElementById('root'), h(Demo));
</script>
</body></html>
