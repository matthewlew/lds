<!-- @dsCard group="Status" viewport="520x260" name="Inline" subtitle="status message — icon paired with every status" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
<style>
.dim{font-family:var(--th-ui);font-size:var(--text-control-sm);color:var(--gray-600);line-height:1.5}
</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { inline, h, mount, raw } = LDS;
const H = '../assets/icons.svg';
mount(document.getElementById('root'), h('div',{style:{display:'flex',flexDirection:'column',gap:12,alignItems:'flex-start'}},
    h(inline,{status:'error',iconHref:H},'Could not save this field.'),
    h(inline,{status:'warning',iconHref:H},'This name is already taken elsewhere.'),
    h(inline,{status:'caution',iconHref:H},'Changes apply on the next sync.'),
    h(inline,{status:'success',iconHref:H},'Saved.'),
    h(inline,{status:'info',iconHref:H},'Alerts are checked hourly.'),
    h('p',{className:'dim',style:{marginTop:6,maxWidth:420}},'The icon comes with the status — same map Banner uses, so red never means two things. Colour on its own is not an accessible carrier, which is why it is on by default; pass icon={null} only when an adjacent element already carries the meaning.')));
</script>
</body></html>
