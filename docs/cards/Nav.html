<!-- @dsCard group="Navigation & Data" viewport="860x720" name="Nav" subtitle="brand bar vs app bar — back, title, actions, stacked flow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
</head>
<body style="margin:0;padding:32px;background:var(--gray-50);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { nav, button, row, link, h, mount, raw } = LDS;

const note = (t) => h('p', { style: { fontFamily: 'var(--th-ui)', fontSize: 'var(--text-control-sm)',
  color: 'var(--text-subdued)', lineHeight: 'var(--leading-normal)', margin: '0 0 12px', maxWidth: '62ch' } }, t);
const head = (t) => h('div', { style: { fontFamily: 'var(--th-ui)', fontSize: 'var(--text-control)',
  fontWeight: 'var(--weight-medium)', color: 'var(--text-subdued)',
  borderBottom: '1px solid var(--gray-200)', paddingBottom: 8, margin: '28px 0 12px' } }, t);
const frame = (...kids) => h('div', { style: { border: '1px solid var(--gray-200)',
  borderRadius: 'var(--radius)', overflow: 'hidden', background: 'var(--background)' } }, ...kids);

const SCREENS = [
  { title: 'Settings', subtitle: null, rows: ['Account', 'Notifications', 'Appearance'] },
  { title: 'Notifications', subtitle: 'Settings', rows: ['Email', 'Push', 'Weekly digest'] },
  { title: 'Email', subtitle: 'Notifications', rows: ['Product news', 'Security alerts'] },
];

let depth = 0;
function Demo() {
  const screen = SCREENS[depth];
  return h('div', { style: { display: 'flex', flexDirection: 'column', maxWidth: 660 } },

    note('Two bars share a name because they sit in the same slot, not because they do the same job. The brand bar is a marketing header, one level deep, with nothing to go back to. The app bar is the chrome of a screen inside a stack, so it carries the one affordance the brand bar has no use for.'),

    head('Brand bar'),
    h(nav, { logo: h('span', null, 'Lew', h('b', null, '.')),
      links: [h('a', { key: 'w', href: '#' }, 'Work'), h('a', { key: 'a', href: '#' }, 'About'),
        h('a', { key: 'c', href: '#' }, 'Contact')] }),

    head('App bar'),
    note('Title truncates to one line at a control step. A wrapping title changes the height of the chrome, and every screen below it shifts.'),
    frame(
      h(nav, { variant: 'bar', title: 'A title long enough that it has to truncate rather than wrap',
        actions: h(button, { variant: 'tertiary', iconOnly: true, iconStart: 'more-horizontal', 'aria-label': 'More' }) }),
      h('div', { style: { padding: 16, fontSize: 'var(--text-body)', color: 'var(--text-subdued)' } }, 'Screen content.')),

    head('Stacked flow — back pops one level'),
    note('The back affordance is deliberately Modal’s: same 36px round target, same chevron-left, same origin edge. A pushed screen and a bottom sheet are one navigation seen from two angles, so a back arrow that changed shape between them would read as a different control. Close dismisses the stack; back pops a single level.'),
    frame(
      h(nav, { variant: 'bar', scrolled: true,
        title: screen.title,
        subtitle: screen.subtitle,
        onBack: depth > 0 ? () => {} : undefined,
        actions: h(button, { variant: 'tertiary', size: 'sm' }, 'Reset') }),
      h('div', null, screen.rows.map((r) => h(row, {
        title: r, chevron: true,
        onClick: depth < SCREENS.length - 1 ? () => {} : undefined,
      })))),
    h('p', { style: { fontFamily: 'var(--th-mono)', fontSize: 'var(--text-meta)',
      color: 'var(--text-subdued)', marginTop: 12 } }, `depth: ${depth} of ${SCREENS.length - 1}`));
}
const root = document.getElementById('root');
function draw() {
  mount(root, h(Demo));
  // The stacked flow is the second frame; the first is the truncation example.
  const flow = root.querySelectorAll('.lds-nav--bar')[1].parentElement;
  const go = (next) => { depth = next; draw(); };
  flow.querySelector('.lds-nav__back')?.addEventListener('click', () => go(depth - 1));
  flow.querySelector('.lds-nav__actions .lds-btn')
    .addEventListener('click', () => go(0));
  flow.querySelectorAll('.lds-row--interactive')
    .forEach((el) => el.addEventListener('click', () => go(Math.min(depth + 1, SCREENS.length - 1))));
}
draw();
</script>
</body></html>
