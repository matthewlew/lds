<!-- @dsCard group="Forms" viewport="720x560" name="Segmented control" subtitle="a value picker, not navigation — sizes, icons, full width" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
</head>
<body style="margin:0;padding:32px;background:var(--gray-50);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
// TODO(migration): this demo held state in React hooks. Rewrite it against
// the controllers — see packages/lds/src/controllers/.
const { segmentedControl, tabs, h, mount, raw } = LDS;

const note = (t) => h('p', { style: { fontFamily: 'var(--th-ui)', fontSize: 'var(--text-control-sm)',
  color: 'var(--text-subdued)', lineHeight: 'var(--leading-normal)', margin: '0 0 10px', maxWidth: '58ch' } }, t);
const head = (t) => h('div', { style: { fontFamily: 'var(--th-ui)', fontSize: 'var(--text-control)',
  fontWeight: 'var(--weight-medium)', color: 'var(--text-subdued)',
  borderBottom: '1px solid var(--gray-200)', paddingBottom: 8, margin: '26px 0 12px' } }, t);

function Demo() {
  const [range, setRange] = React.useState('week');
  const [view, setView] = React.useState('list');
  const [size, setSize] = React.useState('md');
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, maxWidth: 640 } },
    note('A segmented control changes a property of what you are already looking at. Tabs change what you are looking at. They look alike, so the distinction is enforced here rather than left to the author: this renders a radiogroup, which gives arrow-key movement and one tab stop for the whole group.'),

    head('Default'),
    h(segmentedControl, { label: 'Range', value: range, onChange: setRange, options: [
      { value: 'day', label: 'Day' }, { value: 'week', label: 'Week' }, { value: 'month', label: 'Month' },
    ] }),
    h('p', { style: { fontFamily: 'var(--th-mono)', fontSize: 'var(--text-meta)',
      color: 'var(--text-subdued)', marginTop: 10 } }, `value: ${range}`),

    head('With icons, and icon-only'),
    note('Icon-only keeps the label as the accessible name and as the tooltip — the drawing is the affordance, not the label.'),
    h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'center' } },
      h(segmentedControl, { label: 'View', value: view, onChange: setView, options: [
        { value: 'list', label: 'List', icon: 'list' },
        { value: 'grid', label: 'Grid', icon: 'grid' },
      ] }),
      h(segmentedControl, { label: 'Layout', iconsOnly: true, defaultValue: 'list', options: [
        { value: 'list', label: 'List', icon: 'list' },
        { value: 'grid', label: 'Grid', icon: 'grid' },
        { value: 'calendar', label: 'Calendar', icon: 'calendar' },
      ] })),

    head('Sizes'),
    h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'center' } },
      h(segmentedControl, { label: 'Small', size: 'sm', defaultValue: 'a',
        options: [{ value: 'a', label: 'One' }, { value: 'b', label: 'Two' }] }),
      h(segmentedControl, { label: 'Default', value: size, onChange: setSize,
        options: [{ value: 'md', label: 'One' }, { value: 'lg', label: 'Two' }] })),

    head('Full width'),
    note('Full width divides the container evenly, for a control that owns a row on a phone.'),
    h(segmentedControl, { label: 'Mode', full: true, defaultValue: 'all', options: [
      { value: 'all', label: 'All' }, { value: 'mine', label: 'Mine' }, { value: 'shared', label: 'Shared' },
    ] }),

    head('Disabled option'),
    h(segmentedControl, { label: 'Plan', defaultValue: 'free', options: [
      { value: 'free', label: 'Free' },
      { value: 'pro', label: 'Pro' },
      { value: 'team', label: 'Team', disabled: true },
    ] }));
}
mount(document.getElementById('root'), h(Demo));
</script>
</body></html>
