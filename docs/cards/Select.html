<!-- @dsCard group="Forms" viewport="760x420" name="Select" subtitle="states: rest, hover, pressed, focus, error, inactive" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
<style>
.lbl{font-family:var(--th-ui);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-subdued);margin-bottom:12px}
.dim{font-family:var(--th-ui);font-size:11px;color:var(--text-subdued);line-height:1.5}
.cap{font-family:var(--th-ui);font-size:10px;color:var(--text-subdued);margin-bottom:6px;display:block}
.col{display:flex;flex-direction:column;gap:16px;width:300px}
/* preview-only: paints the real hover/pressed/focus declarations so all states
   are visible at once in a static card. */
.demo-hover select,.demo-hover input{border-color:var(--border-hover)}
.demo-press select,.demo-press input{border-color:var(--border-hover);background:var(--bg-pressed)}
.demo-focus select,.demo-focus input{border-color:var(--text-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--text-accent) 22%,transparent)}
</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { select, textField, h, mount, raw } = LDS;
const OPTS = ['5 minutes','15 minutes','1 hour'];
const state = (cap, cls, props) => h('div',{key:cap,className:cls},
  h('span',{className:'cap'},cap),
  h(select,{label:'Check every',defaultValue:'1 hour',options:OPTS,...props}));
function Demo(){
  return h('div',{style:{display:'flex',gap:40,flexWrap:'wrap',alignItems:'flex-start'}},
    h('div',{className:'col'},
      h('div',{className:'lbl'},'Select'),
      state('Rest',''),
      state('Hover — --border-hover','demo-hover'),
      state('Pressed — --bg-pressed','demo-press')),
    h('div',{className:'col'},
      h('div',{className:'lbl'},'\u00a0'),
      state('Focus — --text-accent ring','demo-focus'),
      state('Error — c-500 border + message','',{error:'Pick a cadence your plan allows.'}),
      state('Inactive','',{disabled:true})),
    h('div',{className:'col'},
      h('div',{className:'lbl'},'Text field — same states'),
      h('div',null,h('span',{className:'cap'},'Rest'),h(textField,{label:'Work email',defaultValue:'hello@lew.design'})),
      h('div',{className:'demo-hover'},h('span',{className:'cap'},'Hover'),h(textField,{label:'Work email',defaultValue:'hello@lew.design'})),
      h('div',null,h('span',{className:'cap'},'Inactive'),h(textField,{label:'Work email',defaultValue:'hello@lew.design',disabled:true})),
      h('div',{className:'dim'},'Controls bake their seven roles at :where(.lds-field) — without that, --border went unresolved outside an emph-* context and the whole border declaration was dropped, which is why fields rendered with no boundary at all.')));
}
mount(document.getElementById('root'), h(Demo));
</script>
</body></html>
