<!-- @dsCard group="Navigation & Data" viewport="780x540" name="Tabs" subtitle="single-select list — sections, icon prefix, states, desktop vs mobile" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
<style>
.lbl{font-family:var(--th-ui);font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:10px}
.dim{font-family:var(--th-ui);font-size:12px;color:var(--gray-600);line-height:1.5}
/* preview-only: paints the real hover/pressed declarations so both are visible
   in a static card. Live tabs get these from :hover / :active. */
.demo-hover{background:var(--gray-100);color:var(--gray-900)}
.demo-press{background:var(--gray-200);color:var(--gray-900)}
/* preview-only: mirrors the component's @media(max-width:560px) rules via a
   class, so the mobile strip can sit beside the desktop list in one card. */
.force-mobile .lds-tabs{flex-direction:row;border-right:none;border-bottom:1px solid var(--gray-200);min-width:0;width:100%;overflow-x:auto;scrollbar-width:none}
.force-mobile .lds-tabs::-webkit-scrollbar{display:none}
.force-mobile .lds-tabs__tab{flex:0 0 auto;min-height:var(--control-xl);justify-content:center;padding:10px 14px}
</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { tabs, h, mount, raw } = LDS;
const H = '../assets/icons.svg';
const GROUPED = [
  {section:'Foundations'},
  {id:'color',label:'Color & Emphasis',icon:'photo',iconHref:H},
  {id:'type',label:'Typography',icon:'file',iconHref:H},
  {id:'shape',label:'Shape',icon:'edit',iconHref:H},
  {section:'Components'},
  {id:'buttons',label:'Buttons',icon:'grid',iconHref:H},
  {id:'forms',label:'Forms',icon:'settings',iconHref:H},
];
const FLAT = [{id:'color',label:'Color & Emphasis'},{id:'type',label:'Typography'},{id:'shape',label:'Shape'}];
let active = 'type';
function Demo(){
  return h('div',{style:{display:'flex',flexDirection:'column',gap:28}},
    h('div',{style:{display:'flex',gap:36,alignItems:'flex-start',flexWrap:'wrap'}},
      h('div',null,
        h('div',{className:'lbl'},'Desktop — sections and icon prefix'),
        h(tabs,{active,tabs:GROUPED}),
        h('div',{className:'dim',style:{marginTop:8,maxWidth:210}},'36px row (--control-md), 16px icon (--icon-size-sm). Section headers use the same label composite as the card kicker.')
      ),
      h('div',null,
        h('div',{className:'lbl'},'States'),
        h('div',{className:'lds-tabs',style:{minWidth:190}},
          h('button',{className:'lds-tabs__tab',type:'button'},'Rest'),
          h('button',{className:'lds-tabs__tab demo-hover',type:'button'},'Hover'),
          h('button',{className:'lds-tabs__tab demo-press',type:'button'},'Pressed'),
          h('button',{className:'lds-tabs__tab lds-tabs__tab--active',type:'button'},'Active')),
        h('div',{className:'dim',style:{marginTop:8,maxWidth:230}},'Hover is --bg-hover (gray-100), pressed is --bg-pressed (gray-200) — the same two roles rows and menu items use. Active is --c-100 on the brand ramp. These now paint because the tab list bakes its roles at :where(.lds-tabs).')
      ),
      h('div',{style:{width:290}},
        h('div',{className:'lbl'},'Mobile — under 560px'),
        h('div',{className:'force-mobile'},
          h(tabs,{active,tabs:FLAT})),
        h('div',{className:'dim',style:{marginTop:8}},'Tabs keep their own width and the strip scrolls. Dividing the row evenly squeezed long labels against both edges of their box, so equal widths are gone. Rows grow to the 44px touch floor.')
      )
    ),
    h('div',{style:{borderTop:'1px solid var(--gray-200)',paddingTop:18,display:'flex',flexDirection:'column',gap:6}},
      h('div',{className:'lbl'},'Notes'),
      h('div',{className:'dim'},'Single-select only — one active id, one onChange. Items are {id, label, icon}; {section:"Label"} renders a non-interactive group header (hidden in the mobile strip).'),
      h('div',{className:'dim'},'More items than fit: pair with Menu for the overflow rather than relying on the scroll alone.')
    )
  );
}
const root = document.getElementById('root');
// A tab carries no id in the markup, so a click finds its value by position in
// the list that produced it. The middle .lds-tabs on this card is the hand-built
// state swatch and is meant to stay inert.
function bind(list, items){
  if (!list) return;
  list.querySelectorAll('.lds-tabs__tab').forEach((el, i) => {
    el.addEventListener('click', () => { active = items[i].id; draw(); });
  });
}
function draw(){
  mount(root, h(Demo));
  const lists = root.querySelectorAll('.lds-tabs');
  bind(lists[0], GROUPED.filter((t) => t.id));
  bind(lists[2], FLAT);
}
draw();
</script>
</body></html>
