<!-- @dsCard group="Forms" viewport="720x300" name="Textarea" subtitle="multi-line field, with character count and limit" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
<style>
.lbl{font-family:var(--th-ui);font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:10px}
.dim{font-family:var(--th-ui);font-size:12px;color:var(--gray-600);line-height:1.5}
.col{display:flex;flex-direction:column;gap:16px;width:300px}
</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { textarea, h, mount, raw } = LDS;
function Demo(){
  return h('div',{style:{display:'flex',gap:40,flexWrap:'wrap',alignItems:'flex-start'}},
    h('div',{className:'col'},
      h('div',{className:'lbl'},'Count with a limit'),
      h(textarea,{label:'Note',rows:3,maxLength:120,help:'Shown on the alert.',defaultValue:'Two nights, arriving late.'}),
      h('div',{className:'dim'},'Type to watch it count. At the limit the readout turns red and input stops.')),
    h('div',{className:'col'},
      h('div',{className:'lbl'},'At the limit'),
      h(textarea,{label:'Note',rows:3,maxLength:28,defaultValue:'Two nights, arriving late.aa'})),
    h('div',{className:'col'},
      h('div',{className:'lbl'},'Count with no limit'),
      h(textarea,{label:'Note',rows:3,showCount:true,defaultValue:'Two nights, arriving late.'}),
      h('div',{className:'dim'},'Help text and the count share one row under the control.')));
}
mount(document.getElementById('root'), h(Demo));
</script>
</body></html>
