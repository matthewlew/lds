<!-- @dsCard group="Status" viewport="820x680" name="Toast" subtitle="transient status — statuses, actions, queue, placement" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/styles.css">
</head>
<body style="margin:0;padding:32px;background:var(--gray-50);font-family:var(--th-body);">
<div id="root"></div>
<script src="../assets/lds.js"></script>
<script>LDS.setIconSprite("../assets/icons.svg");</script>
<script>
const { toast, mountToasts, button, buttonGroup, h, mount, raw } = LDS;

const note = (t) => h('p', { style: { fontFamily: 'var(--th-ui)', fontSize: 'var(--text-control-sm)',
  color: 'var(--text-subdued)', lineHeight: 'var(--leading-normal)', margin: '0 0 12px', maxWidth: '62ch' } }, t);
const head = (t) => h('div', { style: { fontFamily: 'var(--th-ui)', fontSize: 'var(--text-control)',
  fontWeight: 'var(--weight-medium)', color: 'var(--text-subdued)',
  borderBottom: '1px solid var(--gray-200)', paddingBottom: 8, margin: '28px 0 12px' } }, t);

const STATUSES = ['info', 'success', 'warning', 'caution', 'error'];

// What each button raises, in the order they are drawn. The buttons carry no
// attribute naming their message — the list is the binding.
const RAISES = [
  ...STATUSES.map((s) => [s, () => ({
    status: s,
    title: s[0].toUpperCase() + s.slice(1),
    children: s === 'error' ? 'This one stays until you dismiss it.' : 'Saved to your workspace.',
  })]),
  ['plain', () => 'A bare string is the body.'],
  ['with action', () => ({
    status: 'success', title: 'Moved to archive',
    actions: raw(button({ variant: 'tertiary', size: 'sm', children: 'Undo' })),
  })],
];

function Raise() {
  return h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
    RAISES.map(([label]) => h(button, { variant: 'secondary', size: 'sm' }, label)));
}

function Demo() {
  return h('div', { style: { display: 'flex', flexDirection: 'column', maxWidth: 660 } },
    note('A banner is a field the page contains and it stays until the condition changes. A toast is chrome the system raises and it leaves on its own. So a toast is the wrong place for anything the user must act on or re-read — if dismissing it can lose information, it wanted to be a banner.'),

    head('Raise one'),
    note('The queue holds three; the oldest is dropped first, because the newest message is the one being waited for. An error never auto-dismisses — a message you have to catch inside five seconds is one some people will never read.'),
    h('div', { className: 'raise' }, h(Raise)),

    head('Every status, statically'),
    note('Statuses and icons come from the same map Banner and Inline read, so a toast error and a banner error cannot disagree about what red means. The blocking statuses take the filled glyph.'),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 420 } },
      STATUSES.map((s) => h(toast, { key: s, status: s, title: s[0].toUpperCase() + s.slice(1),
        dismissible: true }, 'The condition, stated once.'))),

    head('Neutral, and with actions'),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 420 } },
      h(toast, null, 'No status. Just a note that something happened.'),
      h(toast, { status: 'success', title: 'Archived',
        actions: h(button, { variant: 'tertiary', size: 'sm' }, 'Undo') },
        '3 items moved out of your inbox.')));
}
const root = document.getElementById('root');
mount(root, h(Demo));

// The viewport is global chrome, so it is mounted once on the body rather than
// inside the demo. React's ToastProvider wrapped its children and rendered the
// viewport in place; there is no provider here, and no wrapper element either.
const toasts = mountToasts(document.body, { placement: 'bottom', max: 3 });
root.querySelector('.raise').querySelectorAll('.lds-btn')
  .forEach((el, i) => el.addEventListener('click', () => toasts.toast(RAISES[i][1]())));
</script>
</body></html>
