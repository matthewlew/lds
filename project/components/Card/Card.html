<!-- @dsCard group="Cards" viewport="1080x760" name="Card" subtitle="emphasis levels, and selectable with hover / pressed / selected / inactive" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body)}
.lbl{font-family:var(--th-ui);font-size:var(--text-control-sm);font-weight:var(--weight-medium);color:var(--gray-700);margin-bottom:12px}
.dim{font-family:var(--th-ui);font-size:var(--text-control-sm);color:var(--gray-600);line-height:1.55;margin-top:10px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cap{font-family:var(--th-mono);font-size:10px;color:var(--gray-500);margin-bottom:6px}
section{margin-bottom:34px}
/* forces one sample of each state so all four are visible at once — the live
   cards below still get theirs from :hover / :active */
.f-hover{background:var(--bg-hover);border-color:var(--text-accent)}
.f-press{background:var(--bg-pressed);border-color:var(--text-accent)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Card, Button, Tag } = window.LDSLewDesignSystem_1b8684;
const EMPH = [
  ['plain','the default surface'],
  ['subtle','a tint of the hue'],
  ['soft','tint with hue ink'],
  ['strong','filled, knockout ink'],
  ['stark','the hue at full depth']
];
function Emphasis(){
  return React.createElement('div',{className:'grid'},
    EMPH.map(([e,note])=>React.createElement('div',{key:e},
      React.createElement('div',{className:'cap'},'emph-'+e),
      React.createElement(Card,{emphasis:e,hue:'green',kicker:'Permit',title:'Cables season',
        body:note,meta:'Opens 7am PT'}))));
}
function Selectable(){
  const [sel,setSel] = React.useState('half');
  const opt = (id,title,body) => React.createElement(Card,{key:id,selectable:true,
    selected:sel===id,onClick:()=>setSel(id),kicker:'Route',title,body});
  return React.createElement('div',null,
    React.createElement('div',{className:'grid'},
      opt('half','Half Dome','14.2 mi · 4,800 ft'),
      opt('clouds','Clouds Rest','12.4 mi · 3,100 ft'),
      opt('mist','Mist Trail','5.4 mi · 2,000 ft')),
    React.createElement('div',{className:'dim'},'Click any of them \u2014 selection is live, and Tab then Space works, because a selectable card is a real <button> rather than a div with a click handler. That is what supplies keyboard activation, the focus ring and a reported pressed state for free.'));
}
function States(){
  const S = [
    ['resting',{}],['hover',{className:'f-hover'}],['pressed',{className:'f-press'}],
    ['selected',{selected:true}],['inactive',{disabled:true}],['inactive + selected',{disabled:true,selected:true}]
  ];
  return React.createElement('div',{className:'grid'},
    S.map(([cap,props])=>React.createElement('div',{key:cap},
      React.createElement('div',{className:'cap'},cap),
      React.createElement(Card,Object.assign({selectable:true,kicker:'Route',
        title:'Clouds Rest',body:'12.4 mi \u00b7 3,100 ft'},props)))));
}
function Demo(){
  return React.createElement('div',null,
    React.createElement('section',null,
      React.createElement('div',{className:'lbl'},'Emphasis levels'),
      React.createElement(Emphasis),
      React.createElement('div',{className:'dim'},'One class resolves all seven object-colour roles together \u2014 background, text, subdued text, accent, icon, border, separator \u2014 so the card never names a colour. Every level here is the same markup with a different emphasis, on the same hue.'),
      React.createElement('div',{className:'dim'},'The kicker tracks --text-accent and the body tracks --text-subdued, which is why the hierarchy survives into strong and stark where a hand-picked grey would go invisible.')),
    React.createElement('section',null,
      React.createElement('div',{className:'lbl'},'Selectable'),
      React.createElement(Selectable)),
    React.createElement('section',null,
      React.createElement('div',{className:'lbl'},'Selectable \u2014 every state'),
      React.createElement(States),
      React.createElement('div',{className:'dim'},'Hover and pressed come from --bg-hover and --bg-pressed, so they work at every emphasis and in dark mode without a second rule. Selection is marked twice, by an accent border and an inset ring: on a soft or media emphasis a single ring can land at almost no contrast against the fill.'),
      React.createElement('div',{className:'dim'},'The ring is inset so the card\u2019s footprint never changes between states \u2014 an outset ring would shift every card in the grid on selection. Inactive removes the ring and the hover response as well as dimming: a faded card that still lights up on hover reads as clickable.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo));
</script>
</body></html>
