<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<style>
.lbl{font-family:var(--th-ui);font-size:12px;font-weight:500;color:var(--gray-700);margin-bottom:10px}
.dim{font-family:var(--th-ui);font-size:12px;color:var(--gray-600);line-height:1.5}
.sheet{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden}
.col{display:flex;flex-direction:column;gap:10px;width:330px}
/* preview-only: paints the real hover/pressed declarations for the static card. */
.demo-hover{background:var(--gray-100)}
.demo-press{background:var(--gray-200)}
</style>
</head>
<body style="margin:0;padding:28px;background:var(--gray-50,#FAF9EA);font-family:var(--th-body);">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Row, Checkbox } = window.LDSLewDesignSystem_1b8684;
const H = '../../icons.svg';
function Demo(){
  const [picked,setPicked]=React.useState('hour');
  const [many,setMany]=React.useState(['half']);
  const toggle=(id)=>setMany(m=>m.includes(id)?m.filter(x=>x!==id):[...m,id]);
  return React.createElement('div',{style:{display:'flex',gap:36,flexWrap:'wrap',alignItems:'flex-start'}},
    React.createElement('div',{className:'col'},
      React.createElement('div',{className:'lbl'},'Navigation — chevron'),
      React.createElement('div',{className:'sheet'},
        React.createElement(Row,{title:'Half Dome, late June',subtitle:'Checked every hour',onClick:()=>{},chevron:true,iconHref:H}),
        React.createElement(Row,{title:'Tuolumne Meadows',subtitle:'Checked every 15 min',onClick:()=>{},chevron:true,iconHref:H,className:'demo-hover'}),
        React.createElement(Row,{title:'Clouds Rest',subtitle:'Checked daily',onClick:()=>{},chevron:true,iconHref:H,className:'demo-press'})),
      React.createElement('div',{className:'dim'},'Rows two and three show hover and pressed; live rows get them from :hover and :active.')),
    React.createElement('div',{className:'col'},
      React.createElement('div',{className:'lbl'},'Selection — checkmark'),
      React.createElement('div',{className:'sheet'},
        [['5min','Every 5 minutes'],['15min','Every 15 minutes'],['hour','Every hour']].map(([id,label])=>
          React.createElement(Row,{key:id,title:label,onClick:()=>setPicked(id),selected:picked===id,iconHref:H}))),
      React.createElement('div',{className:'dim'},'One pick: the row is the control and the checkmark reports it — nothing else is added. Click a row to move it.'),
      React.createElement('div',{className:'sheet',style:{marginTop:6}},
        [['half','Half Dome'],['tuolumne','Tuolumne Meadows'],['clouds','Clouds Rest']].map(([id,label])=>
          React.createElement(Row,{key:id,title:label,onClick:()=>toggle(id),selected:many.includes(id),iconHref:H}))),
      React.createElement('div',{className:'dim'},'Several picks work the same way, but a checkmark only appears once a row is chosen — so nothing tells the user multi-select exists.')),
    React.createElement('div',{className:'col'},
      React.createElement('div',{className:'lbl'},'Multi-select — prefer Checkbox'),
      React.createElement('div',{className:'sheet',style:{padding:'4px 14px'}},
        React.createElement(Checkbox,{label:'Half Dome',defaultChecked:true}),
        React.createElement(Checkbox,{label:'Tuolumne Meadows'}),
        React.createElement(Checkbox,{label:'Clouds Rest, including the long approach from Tenaya Lake'})),
      React.createElement('div',{className:'dim'},'An empty box advertises that more than one can be picked, which a missing checkmark cannot. Use checkmark rows for a single choice, checkboxes when the set is genuinely multi-select.'),
      React.createElement('div',{className:'dim',style:{marginTop:6}},'The third label wraps: the box aligns to the first line, not to the middle of the row or the top of the container. One-line labels sit centred because the height comes from symmetric padding rather than a min-height.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo));
</script>
</body></html>
